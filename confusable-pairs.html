<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易混对子 · System Design 30 天</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3faf6; --card:#ffffff; --ink:#0f3d2e; --body:#3a463f; --muted:#6a7872;
    --accent:#15a06a; --accent-ink:#0c7a50; --accent-soft:#e8f6ef; --accent-soft-2:#eef9f3;
    --border:#e3ebe6; --border-soft:#eef3f0;
    --amber:#8a5a00; --amber-soft:#fbf1da; --amber-bd:#f1e0b8;
    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(15,61,46,.04), 0 8px 28px rgba(15,61,46,.06);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--body);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:880px;margin:0 auto;padding:0 22px 96px;}

  /* sticky control bar */
  .bar{position:sticky;top:0;z-index:30;background:rgba(243,250,246,.92);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--border);}
  .bar .inner{max-width:880px;margin:0 auto;padding:14px 22px 12px;}
  .titlerow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:11px;}
  .titlerow h1{font-size:22px;color:var(--ink);font-weight:700;margin:0;letter-spacing:-.01em;}
  .titlerow .sub{font-size:13px;color:var(--muted);}
  .count{margin-left:auto;font-size:13px;color:var(--accent-ink);font-weight:600;font-family:var(--mono);}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .search{flex:1;min-width:200px;position:relative;}
  .search input{width:100%;font-family:var(--font);font-size:15px;color:var(--ink);background:var(--card);
    border:1px solid var(--border);border-radius:99px;padding:9px 36px 9px 38px;outline:none;transition:border-color .15s,box-shadow .15s;}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}
  .search .clr{position:absolute;right:11px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--muted);
    cursor:pointer;font-size:17px;line-height:1;padding:2px;display:none;}
  .search .clr:hover{color:var(--ink);}
  /* quiz toggle */
  .toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink);
    background:var(--card);border:1px solid var(--border);border-radius:99px;padding:7px 13px;cursor:pointer;user-select:none;transition:border-color .15s,background .15s;white-space:nowrap;}
  .toggle:hover{border-color:#cfe7da;}
  .toggle .sw{position:relative;width:34px;height:19px;border-radius:99px;background:#d6e2dc;transition:background .18s;flex-shrink:0;}
  .toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .18s;}
  .toggle.on{background:var(--accent-soft);border-color:#bfe6d2;color:var(--accent-ink);}
  .toggle.on .sw{background:var(--accent);}
  .toggle.on .sw::after{transform:translateX(15px);}

  .intro{font-size:13.5px;color:var(--muted);margin:18px 2px 4px;line-height:1.6;}
  .intro b{color:var(--accent-ink);font-weight:600;}

  main{margin-top:14px;}

  /* pair card */
  .pc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px 14px;margin-bottom:14px;
    box-shadow:var(--shadow);transition:border-color .15s;}
  .pc:hover{border-color:#cfe7da;}
  .pc.trip{border-color:var(--amber-bd);background:linear-gradient(180deg,#fffdf7,#ffffff 60%);}
  .pc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .badge{font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-bd);padding:2px 9px;border-radius:99px;white-space:nowrap;}
  .grow{flex:1;}
  .src{font-size:11px;color:var(--accent-ink);background:#eef9f3;border:1px solid #cdeede;padding:2px 8px;border-radius:99px;white-space:nowrap;}
  .jump{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;color:var(--accent);
    text-decoration:none;font-size:14px;border:1px solid var(--border);background:var(--card);transition:background .15s,color .15s;}
  .jump:hover{background:var(--accent);color:#fff;}

  /* two-term compare */
  .vs{display:grid;grid-template-columns:1fr 34px 1fr;gap:0;align-items:stretch;}
  .side{padding:12px 14px;border:1px solid var(--border-soft);border-radius:var(--radius-sm);background:var(--accent-soft-2);}
  .side .term{font-family:var(--mono);font-size:14.5px;font-weight:600;color:var(--ink);}
  .side .zh{font-size:12.5px;color:var(--accent-ink);font-weight:600;margin:1px 0 6px;}
  .side .sdef{font-size:13px;color:var(--body);line-height:1.55;}
  .vsmid{display:flex;align-items:center;justify-content:center;}
  .vsmid span{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--border);
    border-radius:99px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;}

  /* reveal area */
  .reveal{margin-top:13px;}
  .row{display:flex;gap:9px;font-size:13.5px;line-height:1.6;padding:7px 0;border-top:1px dashed var(--border);}
  .row:first-child{border-top:none;}
  .rk{flex-shrink:0;font-weight:700;font-size:11.5px;letter-spacing:.02em;width:62px;padding-top:2px;}
  .rk.diff{color:var(--accent-ink);}
  .rk.eg{color:#0d8a5a;}
  .rk.mn{color:var(--amber);}
  .rv{flex:1;color:var(--body);}
  .rv b{color:var(--ink);font-weight:600;}
  .row.mn .rv{background:var(--amber-soft);border:1px solid var(--amber-bd);border-radius:8px;padding:6px 10px;color:#6b4e10;font-weight:500;}

  /* quiz mode: hide reveal behind a tap */
  .quiz .reveal{display:none;}
  .quiz .pc.open .reveal{display:block;}
  .tap{display:none;margin-top:12px;text-align:center;font-size:13px;font-weight:600;color:var(--accent-ink);
    background:var(--accent-soft);border:1px dashed #bfe6d2;border-radius:var(--radius-sm);padding:9px;cursor:pointer;user-select:none;}
  .tap:hover{background:#d8f0e4;}
  .quiz .pc:not(.open) .tap{display:block;}

  .empty{text-align:center;color:var(--muted);font-size:15px;padding:60px 20px;}
  footer{text-align:center;margin-top:40px;padding-top:22px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);}

  @media (max-width:600px){
    .count{width:100%;margin-left:0;}
    .vs{grid-template-columns:1fr;gap:8px;}
    .vsmid{height:8px;}
    .vsmid span{transform:rotate(90deg);}
    .rk{width:54px;}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="inner">
    <div class="titlerow">
      <h1>易混对子 Confusable Pairs</h1>
      <span class="sub">System Design · 30 天</span>
      <span class="count" id="count"></span>
    </div>
    <div class="controls">
      <div class="search">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="搜索英文 / 中文 / 解释…" autocomplete="off" spellcheck="false">
        <button class="clr" id="clr" title="清空" aria-label="清空">×</button>
      </div>
      <div class="toggle" id="quizBtn" role="switch" aria-checked="false" tabindex="0">
        <span class="sw"></span>测验模式
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <p class="intro">
    每张卡是一对<b>容易混的概念</b>：两边各一句定义，下面是<b>关键区别 / QuoteFlow 例子 / 记一句</b>。
    标 <span class="badge">⚠ 你栽过</span> 的是你前五天实际答偏过的，优先复习。
    打开<b>测验模式</b>会盖住答案——先自己说出区别，再点开核对。
  </p>
  <main id="main"></main>
  <footer>
    System Design · 30 天学习计划　·　易混对子复习卡（讨论中维护，配套 glossary.html）<br>
    贯穿案例：QuoteFlow（虚构的寿险报价 + 保单管理平台，纯属虚构）
  </footer>
</div>

<script>
/* ──────────────────────────────────────────────────────────────
   维护说明：加新对子只改下面 PAIRS 数组，一条一个对象。字段：
     a / b   两个易混概念，各含 {t 英文, zh 中文, def 一句定义}
     diff    关键区别（最重要的一行）
     eg      QuoteFlow 例子（可省略）
     mn      记一句 / 口诀
     src     来源，如 'Day 2'
     link    关联学习资源（用 L.xx）
     trip    true = Matt 实际栽过 → 标「⚠ 你栽过」并置顶
   排序、搜索、测验模式全自动，无需改结构。
   ────────────────────────────────────────────────────────────── */

const L = {
  d1:'Day-01-Intro-and-Requirements.html',
  d2:'Day-02-quantifying-nfrs.html',
  d3:'Day-03-estimation-and-capacity.html',
  d4:'Day-04-networking-fundamentals.html',
  d5:'Day-05-api-design.html',
  d6:'Day-06-load-balancing-scaling.html',
  d7:'Day-07-caching.html',
  d8:'Day-08-relational-db-acid.html',
  d9:'Day-09-indexing-query-performance.html',
  ps:'notes/Day-09-page-split.html',
  d10:'Day-10-data-modeling.html',
  nf:'notes/Day-10-normal-forms.html',
  d11:'Day-11-nosql-families.html',
  fg:'notes/Day-11-fraud-graph.html',
  d12:'Day-12-replication-consistency.html',
  d13:'Day-13-partitioning-sharding.html',
  hr:'notes/Day-13-hash-ring.html',
  d14:'Day-14-transactions-isolation.html',
  d15:'Day-15-message-queues.html',
  asm:'notes/Day-15-async-state-machine.html',
  d16:'Day-16-event-driven-kafka.html',
  d17:'Day-17-batch-vs-stream-pipelines.html',
  d18:'Day-18-idempotency-delivery.html',
};

const PAIRS = [
  { trip:true, src:'Day 2', link:L.d2,
    a:{t:'Consistency (strong)', zh:'强一致 · 数据存储层', def:'多副本下，写入后别处能不能立刻读到最新值。'},
    b:{t:'Reproducibility / Determinism', zh:'可复现 / 确定性 · 计算逻辑层', def:'同样输入算出同样结果，与有几个副本无关。'},
    diff:'一个问“大家看到的是不是同一份数据”（副本同步），一个问“同样输入算不算得出同一个数”（算法确定）。哪怕单机无副本，掺了随机数 / 时间戳也会破坏 reproducibility，却与 consistency 无关。',
    eg:'费率表 v1→v2 切换，不能让用户 A 读到 v1、B 读到 v2 = consistency；同一投保人、同信息两次报价必须分毫不差 = reproducibility。两者一起支撑 auditability。',
    mn:'consistency = 同一份；reproducibility = 同一个数。' },

  { trip:true, src:'Day 3', link:L.d3,
    a:{t:'Mutual Exclusion (lock)', zh:'互斥访问 / 锁 · 并发控制', def:'同一资源，同一刻只允许一个访问者。'},
    b:{t:'Mutually Exclusive Events', zh:'互斥事件 · 概率', def:'两个事件不可能同时发生。'},
    diff:'中文都叫“互斥”，其实毫不相干——一个是锁（并发），一个是概率。容量估算撞车时影响相反：抢同一资源的“互斥访问”→ 排队 → 需求相加；“互斥事件”（不同时发生）→ 反而不该相加。',
    eg:'夜间批量与早高峰报价抢同一份 CPU（互斥访问）→ 用 peak + peak 叠加估容量。',
    mn:'锁的互斥 = “同一刻只一个能进”；概率的互斥 = “俩不会一起来”。' },

  { trip:true, src:'Day 5', link:L.d5,
    a:{t:'Under-fetching', zh:'获取不足', def:'一屏要的数据散在多个接口，得发多次请求 → 延迟高。'},
    b:{t:'Over-fetching', zh:'过度获取', def:'一个接口返回一大坨，只用得上一半字段 → 浪费带宽。'},
    diff:'under = 取得太少（要多跑几趟）；over = 取得太多（拿了用不上）。GraphQL 让客户端精确点字段，一次解决两者。',
    eg:'拼客户档案要调 /customer + /policies + /quotes 三次 = under；调 /customer 返回几十个用不到的字段 = over。',
    mn:'under = 跑太多趟；over = 拿太多货。' },

  { trip:true, src:'Day 1', link:L.d1,
    a:{t:'Latency levers', zh:'延迟杠杆 · 要快', def:'单条处理 · 留余量（ρ 压低）· 随机点查 · 热缓存常驻。'},
    b:{t:'Throughput levers', zh:'吞吐杠杆 · 要多', def:'攒批处理 · 吃满利用率（ρ 拉高）· 顺序扫 · 流式。'},
    diff:'几乎每一项都相反——batching 是 throughput 的朋友、latency 的敌人；高利用率提吞吐却推高尾延迟。同一台机没法又留空又吃满。',
    eg:'实时报价压 latency（留余量 + 热费率表）vs 夜间批量拉 throughput（攒批 + 吃满）→ 所以拆成两条路。',
    mn:'要快 → 留空 + 单条 + 热缓存；要多 → 攒批 + 吃满 + 顺序扫。' },

  { src:'Day 2', link:L.d2,
    a:{t:'Strong Consistency', zh:'强一致', def:'任何读都拿到最新写入；要跨副本协调 → 更慢、可用性更脆。'},
    b:{t:'Eventual Consistency', zh:'最终一致', def:'副本最终收敛，短时间可能读到旧值；换低延迟、高可用。'},
    diff:'强 = 立刻一致（贵）；最终 = 迟早一致（省）。按“读到旧值能不能忍”来选。',
    eg:'当前生效费率表版本 → 强一致（红线）；喂分析下游的数据 → 最终一致就够。',
    mn:'强一致 = 立刻；最终一致 = 迟早。' },

  { src:'Day 2', link:L.d2,
    a:{t:'Serial fan-out', zh:'串行扇出', def:'一个下游回来才发下一个 → 总延迟 ≈ sum（各段之和）。'},
    b:{t:'Parallel fan-out', zh:'并行扇出', def:'同时发所有下游 → 总延迟 ≈ max（只等最慢那个）。'},
    diff:'并行把 sum 压成 max（好事），但 max 会放大尾延迟——只要一个慢，整体就慢（达标概率 0.99^N）。',
    eg:'报价同时取费率表 + 核保 + 再保参数，并行只等最慢那项；但扇出越多，至少一个落尾部的概率越高。',
    mn:'串行加总（sum）；并行取最大（max）。' },

  { src:'Day 5', link:L.d5,
    a:{t:'Offset pagination', zh:'offset 分页 · 按位置', def:'LIMIT/OFFSET 从头数；能跳任意页 / 算总数，但深翻 O(offset) 越来越慢、增删会重复漏算。'},
    b:{t:'Cursor pagination (keyset)', zh:'cursor 分页 · 按书签', def:'记住上次最后一行要其后的；有索引则 O(limit) 翻多深都一样快、不重不漏，但不能跳页 / 无总数。'},
    diff:'offset 从头数（可跳页但深翻慢、会错位）；cursor 接着书签（快且稳，但只能往后）。',
    eg:'后台带页码的表格 → offset；无限滚动 / 夜间批量遍历 → cursor。',
    mn:'offset = 从头数；cursor = 接着书签。' },

  { src:'Day 4', link:L.d4,
    a:{t:'mTLS / Authentication', zh:'你是谁', def:'验证身份——传输层互验证书（机器对机器）。'},
    b:{t:'Token / Authorization', zh:'你能干什么', def:'授权范围——应用层 scope / 权限。'},
    diff:'不是二选一，是分层互补：先确认“你是谁”（authn），再决定“你能干什么”（authz）。',
    eg:'broker 通道用 mTLS 验“是哪个 broker”（你是谁）+ 再带 token 限定“能调哪些接口、限流多少”（你能干什么）。',
    mn:'mTLS / authn = 你是谁；token / authz = 你能干什么。' },

  { src:'Day 5', link:L.d5,
    a:{t:'Additive change', zh:'向后兼容变更', def:'只增字段、不删不改 → 老调用方不受影响，不用动版本。'},
    b:{t:'Breaking change', zh:'破坏性变更', def:'删字段、改类型 / 语义、加必填 → 老调用方会失败，必须上新版本号。'},
    diff:'只增 = 兼容（原地改）；删改 = 破坏（上 /v2）。API 是“难反悔的契约”，默认只增不改不删。',
    eg:'给报价响应加一个新可选字段 = additive；把 price 从字符串改成数字 = breaking → /v2。',
    mn:'只增 = 兼容；删改 = 破坏，上版本。' },

  { trip:true, src:'Day 6', link:L.d6,
    a:{t:'Sticky routing', zh:'靠路由保平安', def:'按 cookie/IP 让同一用户 / 重试总落同一台，靠“回到那台”读到之前的状态。'},
    b:{t:'Stateless + Shared Store', zh:'落哪台都行', def:'状态 / 幂等记录放共享存储，任何一台都能查到 → 不依赖回到同一台。'},
    diff:'一个靠“路由到同一台”、一个靠“状态在共享处”。重试常因那台挂了才发生 → sticky 在故障时恰恰失效；干净解是 stateless + 共享存储。',
    eg:'我一度以为“重试带同 idempotency key → LB 认得 key → 路由回原机判重”。错：LB 不认识 key，幂等记录在共享存储，重试落到任意一台查 key 即可判重。',
    mn:'别靠“回同一台”；靠“状态在共享处”，落哪台都对。' },

  { src:'Day 6', link:L.d6,
    a:{t:'Vertical (scale up)', zh:'纵向 · 换台更大的', def:'同一台加 CPU/内存/磁盘；简单不改代码，但有硬天花板、价格非线性、仍是单点。'},
    b:{t:'Horizontal (scale out)', zh:'横向 · 多摆几台', def:'多加同样的机器、LB 摊开流量；近乎无限、天然冗余去掉单点，代价是架构变复杂。'},
    diff:'up = 把一台变强（有上限、没去单点）；out = 多摆几台（无上限、天然冗余）。要高可用必须 out。',
    eg:'早期量小先 scale up 顶一下；报价 API 要高可用 → 一排无状态服务 + LB = scale out。',
    mn:'up 换大的（仍一台）；out 摆多台（去单点）。' },

  { src:'Day 6', link:L.d6,
    a:{t:'L4 load balancing', zh:'看 IP/端口', def:'只看 TCP/UDP 的 IP+端口、不拆 HTTP；极快、开销低，但看不懂业务、不能按路径路由。'},
    b:{t:'L7 load balancing', zh:'看 HTTP 内容', def:'拆开 HTTP 看得到路径/header/cookie；能按内容路由、做 TLS 终止，稍慢、每请求要解析。'},
    diff:'看得多深决定多聪明——L4 只到端口（快、粗分流）；L7 到应用层（能按 /quotes vs /policies 分流）。常叠用。',
    eg:'外层 L4 扛海量连接，内层 L7 把 /quotes 送定价集群、/policies 送保单集群。',
    mn:'L4 看端口（快）；L7 看路径（聪明）。' },

  { src:'Day 6', link:L.d6,
    a:{t:'Round Robin', zh:'轮询 · 盲发', def:'1→2→3 挨个轮；只数轮到第几个、看不到机器此刻忙不忙。假设请求等重。'},
    b:{t:'Least Connections', zh:'最少连接 · 看实时', def:'发给当前活跃连接最少（最闲）的；用连接数当“有多忙”的代理指标。'},
    diff:'RR 盲发（不看实时状态、慢请求照堆）；least conn 读实时连接数、自动绕开被压住的机器。请求轻重不均时后者稳。',
    eg:'QuoteFlow 报价快、核保慢 → RR 可能把几个慢请求堆到一台；least connections 避免。',
    mn:'RR 数到第几个；least conn 看谁最闲。' },

  { src:'Day 6', link:L.d6,
    a:{t:'Reverse Proxy', zh:'反向代理 · 替后端迎客', def:'站在服务端前面接收所有外部请求的统一入口；隐藏后端，LB 就是它一种。'},
    b:{t:'Forward Proxy', zh:'正向代理 · 替客户端出门', def:'代表客户端去访问外网、隐藏客户端。'},
    diff:'方向相反——reverse 代表服务器迎客（护后端）；forward 代表客户端出门（护你）。',
    eg:'QuoteFlow 的 api.quoteflow.com 入口 = reverse proxy；公司内网统一出外网的代理 = forward proxy。',
    mn:'reverse 迎客（护后端）；forward 出门（护客户端）。' },

  { trip:true, src:'讨论', link:L.d7,
    a:{t:'KV Cache', zh:'注意力 KV 缓存 · 省算力', def:'LLM 生成时缓存已算 token 的 K/V 向量，每步只算新 token → 省 FLOPs / 延迟，模型内部自动，不直接省 token 账单。'},
    b:{t:'Prompt Caching', zh:'提示词缓存 · 省 token 钱', def:'把一段 prefix 的 KV 状态跨请求存住，命中按 ~0.1× 计费；真正降低 token 消耗的那个。'},
    diff:'KV Cache 是一次生成内部复用（省算力）；Prompt Caching 是跨请求持久化 + 按一折计费（省钱）。后者是前者思想的放大版，带 TTL、prefix 精确匹配。',
    eg:'我一度以为「hit KV Cache 就能降低 token 消耗」——其实省 token 钱的是 prompt caching（缓 system prompt / 长文档这种每次都一样的 prefix），KV Cache 只是让单次生成更快。',
    mn:'KV Cache 省算力（内部）；Prompt Caching 省钱（跨请求、打一折）。' },

  { src:'Day 7', link:L.d7,
    a:{t:'Cache Stampede', zh:'惊群 / 击穿 · 一个点决堤', def:'单个热 key 刚过期，瞬间大量请求同时 miss、一起去重算同一个值砸向库。'},
    b:{t:'Cache Avalanche', zh:'雪崩 · 整片决堤', def:'大批 key 同一时刻集体过期（或缓存集群挂掉），流量整片涌向库把它压垮。'},
    diff:'stampede = 一个热 key 失效引发的局部洪峰（单飞锁挡）；avalanche = 大量 key 同时失效 / 缓存整体挂引发的全面洪峰（TTL 打散 + 缓存高可用 + 限流熔断）。',
    eg:'爆款产品费率那个 key 一过期 → stampede；夜里一批 key 用了同一个固定 TTL 同时到期 → avalanche。',
    mn:'stampede 一个点决堤（单飞锁）；avalanche 整片决堤（TTL 打散 + HA）。' },

  { src:'Day 7', link:L.d7,
    a:{t:'Expiration', zh:'过期 · 按时间', def:'到了 TTL，这条数据该失效——跟时间有关。'},
    b:{t:'Eviction', zh:'逐出 · 按容量', def:'缓存内存满了要腾地方，踢掉某些数据（LRU/LFU）——跟它过没过期无关。'},
    diff:'过期看时间（TTL 到没到）；逐出看容量（内存满没满）。一条没过期的数据，内存满时照样可能被逐出。',
    eg:'费率表缓存 TTL=1 天到点失效 = 过期；Redis 内存压满、LRU 把最久没碰的报价进度踢掉 = 逐出。',
    mn:'过期 = 到点了（时间）；逐出 = 没地方了（容量）。' },

  { src:'Day 7', link:L.d7,
    a:{t:'TTL invalidation', zh:'TTL 失效 · 用过时窗口换简单', def:'写入设个存活时间到点自动失效；简单，但窗口内会读到旧值（stale 窗口）。'},
    b:{t:'Versioned immutable key', zh:'版本化不可变 key · 没有 stale 窗口', def:'版本号写进 key、内容不可变，更新=新建 key+改指针；根本没有「同一 key 内容变了」的时刻。'},
    diff:'TTL 容忍一段过时窗口（受监管定价里那几分钟可能算出不可复现的报价）；版本化 key 把失效问题直接消掉，盖章的版本号 = 取数的 key，永远对得上。',
    eg:'用 TTL=5 分钟缓费率表 → 费率刚更新后 5 分钟内有人用旧表报价、且审计日志可能「盖新章用旧数」→ 违规；改用 rate:2026-07 版本化 key 根治。',
    mn:'TTL = 迟早一致（有 stale 窗口）；版本化 key = 当场无窗口（换 key 即换版本）。' },

  { src:'Day 7', link:L.d7,
    a:{t:'Write-through', zh:'写穿透 · 先落库', def:'同时写缓存+数据库，都成功才算成功；缓存总最新、读永远命中新值，但写更慢。'},
    b:{t:'Write-back', zh:'写回 · 先写缓存', def:'先只写缓存立刻返回，稍后异步刷回库；写极快，但缓存一挂、没刷回的就丢了。'},
    diff:'through 先落库再返回（不丢、慢）；back 先写缓存、后台再刷库（快、可能丢）。受监管写路径（签发 / 扣款 / audit log）绝不能用 write-back——丢一笔 = 审计链断。',
    eg:'QuoteFlow 写路径以数据库为权威源、别图快用 write-back；缓存只在读侧帮忙。',
    mn:'through 先落库（稳）；back 先写缓存（快但可能丢）。' },

  { trip:true, src:'讨论', link:L.d8,
    a:{t:'MVCC', zh:'多版本并发控制 · 引擎', def:'每次写生成行的新版本、读按快照挑可见版本；读不加锁、读写不互阻。是底层机制，本身不是「某一档」。'},
    b:{t:'Isolation Level', zh:'隔离级别 · 策略', def:'并发可见度的四档旋钮；档与档的差别在「快照多久换一张」+ 要不要查冲突。'},
    diff:'MVCC 是引擎、隔离级别是建在它上的策略——同一台 MVCC，第 2 档每语句重拍快照、第 3 档整事务冻住同一张、第 4 档冻住再加冲突裁判。「有快照」不是第 3 档专属，第 2 档也在用。',
    eg:'我一度以为 MVCC「属于第 2 档（Read Committed）」、又因为它有 snapshot 像第 3 档——其实它哪一档都不是，是四档共用的引擎；让某档成第 3 档的是「快照被冻住、整事务看同一张」。',
    mn:'MVCC = 相机（引擎）；隔离级别 = 多久拍一张新的（策略）。' },

  { src:'讨论', link:L.d8,
    a:{t:'Deadlock', zh:'死锁 · 锁等待成环', def:'两事务各攥着对方要的锁、首尾相接死等；运行中发生，悲观锁派。'},
    b:{t:'Serialization Failure', zh:'序列化失败 · rw 依赖成环', def:'SSI 提交时发现读写依赖绕成危险环；没人阻塞，乐观检测派。'},
    diff:'都是「砍一个事务 + 应用重试」，但环长在不同地方——deadlock 是运行中真的互相阻塞干等出来的环（锁）；serialization failure 是各自跑完、提交时按读写关系查出来的环（无阻塞）。',
    eg:'两 worker 按相反顺序锁 policy 100/200 → deadlock；两核保事务各读聚合各插一行、SSI 提交时判环 → serialization failure。',
    mn:'deadlock = 等出来的环（锁）；serialization failure = 查出来的环（提交时）。' },

  { src:'讨论', link:L.d8,
    a:{t:'SQL COMMIT', zh:'事务提交 · 并发原语', def:'敲定一批改动并发布：何时对别人可见 / 算数。难题在 isolation、锁、冲突。'},
    b:{t:'Git commit', zh:'版本提交 · 历史原语', def:'沿时间留一个快照血缘点，基本单写者。难题在分支 / 合并 / 回溯。'},
    diff:'同一个英文隐喻（暂存→原子敲定一批→此后持久），但啃的硬骨头不同：SQL-commit 解决并发可见性 → 一锤定音（没法 uncommit、撤要补偿事务）+ 立即全局可见；git-commit 解决历史血缘 → 可改写（amend/rebase/reset）+ 仅本地（发布另靠 push）。',
    eg:'CVS/SVN 的 commit 本就是「推到中央、所有人立刻看到」≈ SQL commit；是 git 故意把 commit 降权成本地、另发明 push（svn commit ≈ git commit + push）。',
    mn:'SQL commit = 并发·一锤定音·即发布；git commit = 历史·可改写·仅本地。' },

  { src:'讨论', link:L.d8,
    a:{t:'2PL + Predicate Lock', zh:'锁派 · 悲观预防', def:'锁住读过的谓词范围，别人往里 INSERT 就阻塞；幻读无从出现。'},
    b:{t:'SSI', zh:'检测派 · 乐观事后', def:'不阻塞、各跑各的快照，提交时查出 rw 冲突环再 abort 一个、重试。'},
    diff:'两种都能兑现 Serializable，破幻读的思路相反——锁派「锁住行将落进的那段范围」（写者干等、可能 deadlock）；SSI「事后发现你读过的范围被人塞了东西就判你重来」（重试白干）。MySQL InnoDB 走前者，PostgreSQL 走后者。',
    eg:'InnoDB Serializable 用 next-key lock 挡住区间内的 INSERT；PG 用 SIReadLock 追踪依赖、提交时报 could not serialize access。',
    mn:'2PL 预防（锁范围、阻塞）；SSI 检测（查冲突、重试）。' },

  { trip:true, src:'Day 9', link:L.d9,
    a:{t:'Equality column', zh:'等值列 · 放复合索引左边', def:'WHERE col = ? 的列；把行收窄成连续一段，能精确 seek。'},
    b:{t:'Range column', zh:'范围列 · 放右边', def:'WHERE col BETWEEN/>/< ? 的列；只能在收窄后的段内扫，它右边的列就用不上了。'},
    diff:'复合索引按列序排，列序口诀「等值列在前、范围列在后」（leftmost prefix 的精炼版）——等值放前才能精确 seek 出一段；范围列一旦出现，它后面的列在索引里就失去定位力。',
    eg:'我答「按时间范围抽查所有 ISSUE 动作」时，把 at 当主键、还判它低选择性走 Seq Scan——漏了 action=\'ISSUE\' 这个等值条件本身就 selective（ISSUE 只是众多动作之一）。正解是 (action, at)：等值在前、范围在后，哪怕时间窗很宽，ISSUE-only 相对几亿行仍是小比例 → 索引照样赢。',
    mn:'等值列在前（能 seek）、范围列在后（段内扫）。' },

  { src:'讨论', link:L.ps,
    a:{t:'Clustered Index', zh:'聚簇 · 数据在叶子', def:'表数据就排在索引叶子里、按主键物理有序；PK 查询零回表、范围扫顺序读。每表仅一个（InnoDB 主键）。'},
    b:{t:'Secondary / Heap Index', zh:'二级 · 叶子给指针', def:'叶子只存 key+指针，回表才拿整行（random IO）；Postgres 的表全是 heap+secondary。'},
    diff:'分水岭是「整行数据存哪」——clustered 数据=索引叶子（零回表）；secondary 数据在别处、索引给指针（要回表）。InnoDB 里 secondary 存的是主键值 → 查两跳、主键越宽全胖。',
    eg:'Postgres 没真聚簇（CLUSTER 只一次性重排），用覆盖索引→Index Only Scan 当替代；InnoDB 主键天生 clustered。',
    mn:'clustered = 数据在叶子（零回表）；secondary = 叶子给指针（要回表）。' },

  { src:'讨论', link:L.ps,
    a:{t:'Random IO', zh:'随机 IO · 到处跳', def:'读散落的 page，每跳一次 HDD 要 seek(~10ms)；回表就是它。'},
    b:{t:'Sequential IO', zh:'顺序 IO · 一路流', def:'读物理连续的 page，磁头不动一路流；Seq Scan 就是它。'},
    diff:'回表随机、Seq Scan 顺序。HDD 上随机慢约 100×；SSD 无机械臂惩罚小，但因 page 粒度 + 预读失效仍输。这是 selectivity 翻转的根因——命中多时海量随机回表反不如整表顺读。',
    eg:'命中 3 行 → 几次随机跳，Index Scan 划算；命中 95% → 上亿次回表随机 IO，优化器改走 Seq Scan。',
    mn:'random 到处跳（贵）；sequential 一路流（便宜）。' },

  { src:'讨论', link:L.d9,
    a:{t:'Key column', zh:'key 列 · 排序+导航', def:'参与排序、进 branch 节点、能 seek/range/最左前缀。'},
    b:{t:'INCLUDE column', zh:'INCLUDE 列 · 只搭车凑覆盖', def:'挂在 leaf 条目尾巴当 payload：不排序、不进 branch、比较器不读它、不能当查询条件。'},
    diff:'key 列决定树的顺序与导航（撑大 branch、让你能按它查）；INCLUDE 列只为「免回表」凑齐覆盖、不让树长高。要 WHERE/ORDER BY 用 → key；只在 SELECT 输出用 → INCLUDE。',
    eg:'(applicant_id) INCLUDE (premium)：树只按 applicant_id 排，premium 躺 leaf 当 payload → SELECT premium WHERE applicant_id=? 走 Index Only Scan。',
    mn:'key 列排序+导航；INCLUDE 列只搭车凑覆盖。' },

  { src:'讨论', link:L.d9,
    a:{t:'UUIDv4', zh:'随机 UUID', def:'纯随机；不可枚举，但随机插入 → page split 满天飞、bloat 重。Supabase 默认 gen_random_uuid() 就是它。'},
    b:{t:'UUIDv7 / ULID', zh:'时间有序 UUID', def:'时间戳在高位、整体单调递增；保留唯一+不可枚举，又几乎无随机插入惩罚。'},
    diff:'同是 UUID，v4 随机（对 B-tree 最差）、v7 时间有序（落最右、对索引友好）。要 UUID 的好处又不想付写性能账，就用 v7。',
    eg:'高写入表（audit_log）主键别用 v4，用 v7 或 bigint；对外暴露的 quote_id 用 UUID 防 broker 枚举别人的报价。',
    mn:'v4 随机（撕碎索引）；v7 时间序（对 B-tree 友好）。' },

  { src:'讨论', link:L.ps,
    a:{t:'Leaf split (copy-up)', zh:'叶子分裂 · 复制上去', def:'新右叶的最小 key 复制一份当父 separator，key 本身仍留在叶子里。'},
    b:{t:'Branch split (push-up)', zh:'branch 分裂 · 移上去', def:'正中那个 separator 移到父节点、不留在裂开的两个半边。'},
    diff:'叶子分裂是「复制」（数据必须全留叶子）；branch 分裂是「移」（branch 只是路标，移走不丢数据）。一路裂到 root 才让树长高一层。',
    eg:'满叶 [80·95·110] 插 100 → 裂成 [80·95]/[100·110]、复制 100 上去；父节点 [40|80|100|120] 溢出 → 取正中 80 移上去、新建 root。',
    mn:'叶子复制（留着）；branch 移动（不留）。' },

  { trip:true, src:'讨论', link:L.d10,
    a:{t:'Snapshot', zh:'快照 · 复制值', def:'源头可变且无版本管理 → 把当时的值复制进本行（applicant_snapshot 里的年龄/吸烟）。'},
    b:{t:'Version Reference', zh:'版本引用 · 存指针', def:'源头已 immutable 版本化 → 只存 version_id 指针；引用不可变 = 等价快照。'},
    diff:'都为「钉死时点」服务，分水岭是源头自己冻结了吗：没冻结只能复制值；冻结了存指针就够——省复制大对象，还能反查 impact（v2026-06 影响了哪些报价）。两步判别：①源头变了本行该不该跟着变？该跟 → FK 引用；②不该跟的：源头有版本 → 引用，没版本 → 快照。',
    eg:'我答思考题把费率表判成「快照」——正解版本引用：rate_table_version 发布即冻结，Quote 只存 version_id；要快照的是客户申报信息（住 Customer 表、会被 UPDATE）。',
    mn:'源头会变就复制（快照）；源头冻结就指针（引用）。' },

  { trip:true, src:'讨论', link:L.d10,
    a:{t:'Mutable state', zh:'可变状态 · 现在是什么', def:'客户资料、in-force 保单状态：UPDATE 合法，老老实实 3NF 范式化。'},
    b:{t:'Immutable fact', zh:'不可变事实 · 当时发生了什么', def:'报价、审计、版本、重算结果：append-only，UPDATE = 销毁证据；反范式随便用（反正不会改）。'},
    diff:'建模第一问就该问「这数据是状态还是事实」：状态可以原地改；事实只能追加（更新 = 关旧开新）。把两类分开建模是 Day 10 最值钱的判断力。',
    eg:'我答夜间重算结果表「该建可变」——重算结果是计算产出的事实、要喂 reserving/再保上报，正解 append-only + UNIQUE(policy_id, run_date)：跨晚只增、晚内重试 no-op。',
    mn:'状态改得；事实改不得（只追加）。' },

  { trip:true, src:'讨论', link:L.d10,
    a:{t:'Duplication', zh:'同一份事实存多处', def:'范式真正禁止的：客户邮箱抄进每条报价，改一处漏一处 = update anomaly。'},
    b:{t:'Similar rows, different facts', zh:'长得像的不同事实', def:'时点 / 事件不同就是不同事实：快照 vs 当前值、attempt 1 vs attempt 2——值一模一样也各有一个家。'},
    diff:'判断标准不是「数据长得像不像」，是「是不是同一份事实」。同一事实多处 = 病；不同时点/事件的相似行 = 合法，但要用显式维度（run_id / attempt_no / status）标出来，别靠 timestamp 默默区分（把去重逻辑推给每个读方）。',
    eg:'我担心重试写两行一样的结果是 duplication——其实要么唯一键把第二行挡在门外（根本不存在），要么 attempt-level 两行是两个事件、不是重复。',
    mn:'范式禁的是「同一事实多处」，不是「长得像出现两次」。' },

  { src:'讨论', link:L.nf,
    a:{t:'Partial Dependency', zh:'部分依赖 · 2NF 禁', def:'非键列只依赖复合主键的一半；quote_coverage 里塞 quote_created_at（只跟 quote_id 有关）。'},
    b:{t:'Transitive Dependency', zh:'传递依赖 · 3NF 禁', def:'非键列绕道依赖另一个非键列；quote 表里塞 customer_email（key → customer_id → email）。'},
    diff:'都让事实被抄多遍、都引来三种 anomaly，违规对象不同：partial 依的是「半个 key」（只在复合主键表出现，surrogate key 免疫）；transitive 依的是「别的非键列」（任何表都可能，日常翻车 95% 在这）。判别各一问：遮住一半 key 还能确定吗 / 这列描述的到底是谁。',
    eg:'(quote_id, coverage_type) 表里的 quote_created_at = partial；quote 表里的 customer_email = transitive。',
    mn:'partial 偏依「半个键」；transitive 绕道「别的列」。' },

  { src:'讨论', link:L.d10,
    a:{t:'SCD Type 1', zh:'覆盖 · 无历史', def:'源系统属性变了就原地 UPDATE 维度行，仓库只剩「现在」。'},
    b:{t:'SCD Type 2', zh:'关旧开新 · 全历史', def:'valid_from / valid_to + is_current，变更 = 关旧行插新行；= OLTP 侧的 effective dating，dbt snapshot 自动做这个。'},
    diff:'选型按「要不要 as-at 重现」：rating factor（吸烟/职业/邮编）要按事件当时口径分析 → Type 2；无关紧要属性 → Type 1。可按列混用（dbt strategy=check + check_cols）。注意仓库快照历史只到跑批频率、开始前补不回——权威记录在源系统。',
    eg:'dim_customer 里 smoker 走 Type 2（改吸烟状态 → 关旧行插新行、各领 surrogate key）；偏好联系方式走 Type 1。',
    mn:'Type 1 只剩现在；Type 2 每段历史各一行。' },

  { src:'讨论', link:L.d10,
    a:{t:'Summary table', zh:'汇总表 · 可重算的缓存', def:'预算好的聚合结果，真相在明细表，drop 掉随时重跑——derived data，失效策略 = 刷新策略。'},
    b:{t:'Snapshot', zh:'快照 · 不可重建的事实', def:'报价当时的输入状态，源头早就变了，丢了永远丢了。'},
    diff:'同是反范式冗余，问一句「丢了怎么办」立刻分家：汇总表可从源完整重算，允许先粗糙后修正；快照不可重建，必须事务内一次写对。维护的紧张程度完全不同。',
    eg:'daily_new_business_summary 算错了重跑一晚就好；applicant_snapshot 写错了无法从现状补——审计事故。',
    mn:'汇总表丢了重算；快照丢了报案。' },

  { trip:true, src:'讨论', link:L.d11,
    a:{t:'System of Record (migration)', zh:'权威记录搬家', def:'把 in-force 保单的「家」整个换成新存储：事务 / 约束 / 备份 / 审计工具链 / 下游分析全要跟着搬。'},
    b:{t:'Derived Read Model', zh:'派生读模型', def:'权威记录不动，为单一访问模式（夜批重算）物化一份读优化副本：可重算、丢了不是事故。'},
    diff:'同一个动作（每天把 in-force 物化成定价输入文档），定位不同天壤之别：当权威记录 = 全部访问模式被一个访问模式绑架；当派生副本 = 「汇总表是长成表的缓存」同款逻辑。搬家前先问：我要换权威记录，还是只要一个读优化副本？',
    eg:'思考题①我把「每天 filter in-force 同步去 MongoDB」当成提议的缺点列出来——翻转视角它就是正解的形状，区别只在谁当 system of record。',
    mn:'搬家动户口；派生只是复印件。' },

  { trip:true, src:'讨论', link:L.d11,
    a:{t:'In-database complexity', zh:'单库内部复杂度', def:'JSONB 列、TOAST 大字段、多形状文档混居——一个库里多了点东西。'},
    b:{t:'System-level complexity', zh:'系统层面复杂度', def:'+1 个独立存储 = +1 套备份、监控、故障模式、权限审查、灾备，以及「两边对不上」的可能。'},
    diff:'「复杂」要先问在哪一层：JSONB 让单库稍复杂，但让系统更简单（一套工具链管到底）；独立文档库让单库各自干净，但系统复杂度暴涨。评估存储方案时系统层面才是大头。',
    eg:'思考题②我答「JSONB 会让整个数据库更复杂」所以像是缺点——方向反了：和独立文档库比，JSONB 恰恰是更简单的方案。',
    mn:'库里乱一点 ≪ 家里多一口。' },

  { trip:true, src:'讨论', link:L.d11,
    a:{t:'Transactional guarantees', zh:'事务保证（JSONB 拿回来的）', def:'快照与 Quote 行同事务原子写、同生同死；外加 JSONB 之外列的约束/外键 + 整套备份/权限/审计工具链。'},
    b:{t:'Schema enforcement', zh:'schema 校验（JSONB 没拿回来的）', def:'JSONB 列内部依旧 schema-on-read：Postgres 不校验 JSON 里的字段和类型，除非显式 CHECK。'},
    diff:'「放进 Postgres」≠「自动有校验」。JSONB 换来的是原子性和工具链，不是 schema 校验——schema_version + 写入口应用层校验，JSONB 和独立文档库两个方案都逃不掉。反对独立文档库的杀手论据是 dual write 没有跨系统原子性（有报价没快照 = 审计事故），不是笼统的「ACID 更安全」。',
    eg:'思考题②我答「独立文档库舍弃了数据库校验、JSONB 保留了」——其实校验两边都没有；JSONB 真正赢在快照和 Quote 行一个事务里落地。',
    mn:'JSONB 给你原子写，不给你验形状。' },

  { src:'讨论', link:L.d11,
    a:{t:'KV Store (hard lookup)', zh:'键值存储 · 硬查找', def:'hash(key) 精确命中唯一 value，O(1)，要么命中要么 miss——Redis / DynamoDB。'},
    b:{t:'Attention QKV (soft lookup)', zh:'注意力机制 · 软查找', def:'query 对所有 key 算相似度 → softmax 加权平均所有 value，人人按相似度贡献一点。'},
    diff:'同源不同物：都来自 dictionary（key→value）抽象，attention 论文原文就是检索隐喻（前身 Key-Value Memory Networks）。分水岭是硬/软：硬查找不可导，attention 把查字典改造成处处连续、可被梯度下降训练的形式 = 可微分的字典查找。顺带第三个 KV：LLM 推理的 KV cache 缓存的是 attention 的 K/V 张量，干的是 Day 7 precompute 的活。',
    eg:'RAG 向量库是中间形态：用 attention 的软相似度打分，最后硬化成离散 top-k（ANN）——按 Day 11 的尺子，它是又一个「为单一访问模式专精的存储」。',
    mn:'KV store 取一个；attention 全都要，按相似度分。' },

  { trip:true, src:'讨论', link:L.d12,
    a:{t:'Sync replication (write knob)', zh:'同步复制 · 写侧旋钮', def:'leader 等 follower 确认再回「写成功」——管的是 durability（写返回前几台先存好）。'},
    b:{t:'Linearizable read (read guarantee)', zh:'线性化读 · 读侧保证', def:'任何两个读都看到同一「当前值」——靠读单一真相源（读 leader）或 consensus 协调读实现。'},
    diff:'「所有用户读到同一版本」是读侧保证（linearizability），不是把写改成 sync 就有：sync 只保证写返回时已确认副本都有，发布的传播窗口里不同 replica 仍可能一个新一个旧，读打到不同 replica 照样不一致。要一致必须在读路径动刀。',
    eg:'PM 要「绝不许两人同一秒读到不同版本费率」，我第一反应是「调成 synchronous」——方向偏了（写旋钮解不了读问题），且更该先质疑这是不是假 NFR。',
    mn:'sync 是写侧 durability；要人人读同一份得在读侧上 linearizable。' },

  { trip:true, src:'讨论', link:L.d12,
    a:{t:'Immune via immutability', zh:'靠不可变免疫 · mutability 轴', def:'版本化、append-only 的数据每条写下永不改 → 读旧副本也是同一个值，lag 不会读到「半新半旧的错值」。'},
    b:{t:'Still pays durability / recency', zh:'仍要付 · 另两根轴', def:'不可变 ≠ 不用付钱：append-only 数据仍要保证「别丢条目」（durability）、「刚 append 的到没到」（recency / read-your-writes）。'},
    diff:'「能不能免疫一致性问题」不是数据实体的固有属性，而是分轴问：不可变只免疫了 mutability（stale 错值）那根轴，durability 和 recency 两根轴照付。把 audit log 当「不可能免疫」是把三根轴混成一根。',
    eg:'思考题②我把 audit log 列进「永远要付一致性钱」——其实它恰是 append-only 不可变的教科书例子（免疫 stale 错值），只是仍要用 QUORUM 保不丢（durability）。',
    mn:'不可变免的是「读到错值」；丢不丢、到没到是另两根轴。' },

  { src:'讨论', link:L.d12,
    a:{t:'Staleness', zh:'陈旧 · 旧但有效', def:'读到一个完整、合法、只是被取代了的旧版本——选 A / eventual 主动买来的，不是故障。'},
    b:{t:'Consistency violation', zh:'一致性被破坏 · 脏 / 错值', def:'读到半写、脏读、或两副本对同一格子给出矛盾的值——真正的错误。'},
    diff:'两次报价用了 v06 / v07 不一样 = staleness（各自都对、各自钉版本可审计），不是一致性被破坏。判别：读到的值本身合法吗？合法但旧 = staleness（问「能不能接受」）；本身就错 = violation（必须修）。',
    eg:'报价路径读到上个月费率版本 = staleness（可接受、可 honor）；split brain 后两边各签一份不同保单 = consistency violation（合规事故）。',
    mn:'旧但对 = staleness；本身就错 = violation。' },

  { src:'讨论', link:L.d12,
    a:{t:'Quote — read / compute (choose A)', zh:'报价 · 读/计算 · 选 A', def:'廉价、可重算，多算一份不构成问题；分区时用手头版本继续报，钉版本号留痕。'},
    b:{t:'Issuance — authoritative write (choose C)', zh:'签发 · 权威写 · 选 C', def:'创建有法律意义的记录，重复 / 分叉 = 合规事故；分区时宁可暂停也不分叉。'},
    diff:'「写不能重、读可以重」的不对称，就是同一系统里报价选 A、签发选 C 的根。同一把尺：这份数据错了 / 丢了代价是什么——报价 ≈ 0（可重算），签发 = 向监管报告的事故。',
    eg:'用户连点两次：报价多出一张无所谓（A）；投保申请重复出两份保单是事故（C）→ 后者要 idempotency key / 唯一约束兜底。',
    mn:'读廉价可重 → A；权威写不可重 → C。' },

  { src:'讨论', link:L.d12,
    a:{t:'Read-your-writes', zh:'读到自己的写 · 异常一', def:'我刚写的 X 要立刻读得到——有一个「确定该存在的目标」，读不到才需重试 / 读 leader。'},
    b:{t:'Monotonic reads', zh:'单调读 · 异常二 · 不倒流', def:'同一用户的读不能先看到新、再看到旧——固定路由到同一副本即可。'},
    diff:'两种都是 lag 制造的读异常，形状不同：read-your-writes 是「自己写的看不到」，monotonic 是「时间倒流」。前者有明确目标（要等到它），后者只要求「别回退」（绑同一副本）。',
    eg:'提交申请后列表是空的 = read-your-writes 违例；刷新看到「核保中」又变回「已提交」= monotonic 违例。',
    mn:'读自己的写 = 看得到我刚写的；单调读 = 别倒退。' },

  { trip:true, src:'讨论', link:L.hr,
    a:{t:'hash(key) mod N', zh:'朴素取模分配', def:'partition = hash(key) mod N，N 是机器数；直接拿余数定分区。'},
    b:{t:'Consistent hashing', zh:'一致性哈希环', def:'节点与 key 上同一个 mod-2³² 环，key 归顺时针第一个节点（successor）。'},
    diff:'搬家量差别的根源：mod N 改的是「整个映射函数」(全局)——N:4→5 几乎每个 key 的余数都变，≈80% 换家；环加节点只改「被接管那段弧」的归属(局部)，≈1/N。所以 rebalancing 的高成本不是「hash 分区」的锅，是「mod N 这种分配法」的锅。',
    eg:'保单库扩容加一台 shard：mod N 近乎全库重哈希搬家；consistent hashing 只搬新节点接管的那段弧。',
    mn:'mod N 改函数 → 全搬；环挪一段弧 → 搬 1/N。' },

  { src:'Day 13', link:L.d13,
    a:{t:'Key-range partitioning', zh:'按键范围切', def:'相邻 key 物理相邻；范围查询高效，但时间型 key 制造「最新分区」热点。'},
    b:{t:'Hash partitioning', zh:'按哈希切', def:'打散落桶；天然均匀，但顺序没了、范围查询退化成 scatter-gather。'},
    diff:'顺序 vs 均匀的对赌：要顺序就赌得过热点，要均匀就放弃范围查询。先想清楚最高频查询长什么样再选（Day 11 老话）。',
    eg:'QuoteFlow audit log 按月 range（审查按时间段 + 旧分区整段归档）；保单库 / 报价历史 hash（均匀第一）。',
    mn:'range 保序赌热点；hash 保匀失顺序。' },

  { src:'Day 13', link:L.d13,
    a:{t:'Local secondary index', zh:'本地二级索引 · document-partitioned', def:'每分区只索引自己的数据；写快（同分区一次写完），二级键查询要 scatter-gather。'},
    b:{t:'Global secondary index', zh:'全局二级索引 · term-partitioned', def:'索引按被索引值切分；读高效（一两个分区），写要跨分区更新 → 慢或异步滞后。'},
    diff:'读贵 vs 写贵的转移。选哪种看二级查询是否高频 / 延迟敏感；写路径敏感就用异步 global index、容忍索引晚几秒。',
    eg:'QuoteFlow「按 customer_id 查保单」用异步 global index——索引滞后无妨，不拖慢保单本体的写入。',
    mn:'local 写快读 scatter；global 读快写跨分区。' },

  { trip:true, src:'Day 13', link:L.d13,
    a:{t:'policy_id（选它当分区键）', zh:'immutable + 均匀', def:'签发即终身不变 → 记录住死在一个分区、不搬家；保单高频按单号点查 → 单分区直达。'},
    b:{t:'customer_id（别选它）', zh:'会变 + 倾斜', def:'客户持单数差异巨大 → 倾斜；归属可变（转让 / 客户合并）→ 记录跨分区搬家；夜间重算时倾斜分区成 straggler。'},
    diff:'选分区键的两条暗规：要 immutable（避免单记录搬家）+ 要均匀（避免热点 & 批处理 straggler）。customer_id 两条都踩。',
    eg:'思考题①：换 customer_id 后「按单号点查」退化 scatter-gather、团体大客户分区成热点 + 夜间 straggler、保单转让触发记录搬家。',
    mn:'分区键要 immutable + 均匀；customer_id 既会变又倾斜。' },

  { trip:true, src:'Day 13', link:L.d13,
    a:{t:'Per-policy 独立', zh:'必要但不充分', def:'各 policy 重算互不影响 → 只解释了「不必重跑别的分区」。'},
    b:{t:'幂等 + 版本钉死', zh:'才真正安全可审计', def:'重跑那片不能翻倍 / 污染已成功部分（UNIQUE(policy_id, run_date)），且复用同一组 rate_table_version → 可复现。'},
    diff:'「独立」只说明不必重跑全部；「能安全重跑那一片」要幂等，「结果可审计可复现」还要钉死输入版本。重跑整晚若版本漂了，反而制造「同一晚两个版本」的不一致。',
    eg:'思考题②：分区 7 失败只重跑它——幂等让重复写变 no-op、钉死 v06 费率让重跑与原批一致、run_id / attempt 留痕让审计看出「第一次失败、第二次成功」。',
    mn:'独立 → 不必重跑全部；幂等 + 钉版本 → 才敢只重跑那片且可审计。' },

  { src:'Day 14', link:L.d14,
    a:{t:'Compensating transaction', zh:'补偿事务', def:'COMMIT 之后才补救：对既成事实再发一笔语义相反的正向新交易去抵消。'},
    b:{t:'Rollback', zh:'真正回滚', def:'COMMIT 之前、事务内部，引擎用 undo log 把未提交改动抹除，外界从没见过。'},
    diff:'时点 + 留痕：rollback 在提交前、不留痕、像没发生过；补偿在提交后、是「新增反向记录」→ 天生 append-only。它撤不掉物理副作用（已发邮件 / 已扣款），所以「补偿不是撤销，且要幂等」。',
    eg:'投保 saga T4 收费失败 → 不能 rollback 已签发的保单（早提交了），只能跑 C3 撤销签发。对寿险 audit log 反是优点：「签发→撤销、谁做的、为什么」整条链留痕，正是合规要的。',
    mn:'rollback 抹除、不留痕；补偿抵消、留 append-only 痕。' },

  { src:'Day 14', link:L.d14,
    a:{t:'2PC (Two-Phase Commit)', zh:'两阶段提交 · 跨库原子提交协议', def:'prepare 投票 → commit/abort 统一裁决；给强一致、中间态不可见，代价是持锁阻塞、协调者挂了陷 limbo。'},
    b:{t:'2PL (Two-Phase Locking)', zh:'两阶段锁 · 单库串行化的锁实现', def:'growing 阶段只拿锁、shrinking 阶段只放锁；是 Serializable 隔离的悲观实现，跟跨库提交无关。'},
    diff:'名字都「两阶段」但毫不相干：2PC 是分布式事务的 COMMIT 协议（跨多库要不要一起提交），2PL 是单库内并发控制的上锁纪律（怎么拿锁保证可串行）。一个管「跨库原子」，一个管「单库隔离」。',
    eg:'QuoteFlow 跨 policies/billing 库硬要原子 → 2PC（不推荐，宁可收单库或 saga）；单库内 Serializable 防 write skew → 可能用 2PL+谓词锁。',
    mn:'2PC = 跨库提交协议；2PL = 单库上锁纪律。两阶段，两回事。' },

  { src:'Day 14', link:L.d14,
    a:{t:'2PC', zh:'两阶段提交 · 强一致', def:'跨库瞬时原子；中间态对外不可见，但全程持锁、可用性差、协调者单点。'},
    b:{t:'Saga', zh:'萨迦 · 最终一致', def:'拆成一串本地事务 + 补偿；高可用、不跨步持锁，但中间态可见、给的是 ACD（无 I）。'},
    diff:'本质是「你能不能容忍中间状态短暂可见」：能忍 → saga（拿 isolation 换 availability）；绝不能（同一笔钱借贷必须瞬时配平）→ 想办法收进单库本地事务，而不是硬上 2PC。',
    eg:'ledger 借贷 = 收单库本地事务；跨服务投保链（申请→核保→签发→收费）= saga（orchestration，每步与补偿都进 audit log）。',
    mn:'2PC 不可见但脆；saga 可见但韧。选择 = 容不容忍中间态。' },

  { src:'Day 14', link:L.d14,
    a:{t:'中间状态可见（saga 弃 I）', zh:'跨服务复合操作没有隔离', def:'saga 每步立刻本地提交 → T1~T4 之间外界真能查到半成品（已签发未收费的「幽灵保单」）。'},
    b:{t:'Isolation（单库给 I）', zh:'单库事务的隔离性', def:'并发事务彼此看不到对方未提交的中间过程，看起来像单独跑。'},
    diff:'同一根「I」轴的两端：单库事务用隔离级别买到 I；saga 为了高可用 + 不持锁主动放弃跨步 I → 半成品漏给外界。「中间状态可见」就是「整个复合操作不是隔离的」的另一种说法。',

/* ── 渲染 / 搜索 / 测验 ── */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(text, q){
  const e = esc(text);
  if(!q) return e;
  const safe = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return e.replace(new RegExp('('+safe+')','gi'), '<mark style="background:#fff0b8;border-radius:3px;padding:0 1px;">$1</mark>');
}

function render(){
  const q = $('#q').value.trim();
  const ql = q.toLowerCase();
  $('#clr').style.display = q ? 'block' : 'none';

  const matches = PAIRS
    .map((p,i)=>({p,i}))
    .filter(({p}) => !ql ||
      (p.a.t+' '+p.a.zh+' '+p.a.def+' '+p.b.t+' '+p.b.zh+' '+p.b.def+' '+p.diff+' '+(p.eg||'')+' '+p.mn)
        .toLowerCase().includes(ql))
    .sort((x,y) => (y.p.trip?1:0)-(x.p.trip?1:0));   // 栽过的置顶

  $('#main').innerHTML = matches.length ? matches.map(({p,i}) => {
    const badge = p.trip ? '<span class="badge">⚠ 你栽过</span>' : '';
    const jump = p.link ? `<a class="jump" href="${p.link}" title="去对应学习文档">↗</a>` : '';
    const eg = p.eg ? `<div class="row eg"><span class="rk eg">例子</span><span class="rv">${hl(p.eg,q)}</span></div>` : '';
    return `<article class="pc${p.trip?' trip':''}" data-i="${i}">
      <div class="pc-h">${badge}<span class="grow"></span><span class="src">${esc(p.src)}</span>${jump}</div>
      <div class="vs">
        <div class="side">
          <div class="term">${hl(p.a.t,q)}</div><div class="zh">${hl(p.a.zh,q)}</div>
          <div class="sdef">${hl(p.a.def,q)}</div>
        </div>
        <div class="vsmid"><span>vs</span></div>
        <div class="side">
          <div class="term">${hl(p.b.t,q)}</div><div class="zh">${hl(p.b.zh,q)}</div>
          <div class="sdef">${hl(p.b.def,q)}</div>
        </div>
      </div>
      <div class="tap">👆 先自己说出区别，点开核对</div>
      <div class="reveal">
        <div class="row diff"><span class="rk diff">关键区别</span><span class="rv">${hl(p.diff,q)}</span></div>
        ${eg}
        <div class="row mn"><span class="rk mn">记一句</span><span class="rv">${hl(p.mn,q)}</span></div>
      </div>
    </article>`;
  }).join('') : `<div class="empty">没有匹配的对子，换个词试试。</div>`;

  const trips = PAIRS.filter(p=>p.trip).length;
  $('#count').textContent = q ? `显示 ${matches.length} / 共 ${PAIRS.length} 对`
                              : `共 ${PAIRS.length} 对 · ⚠ ${trips} 对栽过`;
}

// 测验模式：盖住答案，点卡片翻开
const quizBtn = $('#quizBtn');
function toggleQuiz(){
  const on = document.body.classList.toggle('quiz');
  quizBtn.classList.toggle('on', on);
  quizBtn.setAttribute('aria-checked', on);
  if(!on) document.querySelectorAll('.pc.open').forEach(el=>el.classList.remove('open'));
}
quizBtn.addEventListener('click', toggleQuiz);
quizBtn.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();toggleQuiz();} });

// 测验模式下点卡片（避开链接）翻开
$('#main').addEventListener('click', e=>{
  if(!document.body.classList.contains('quiz')) return;
  if(e.target.closest('.jump')) return;
  const card = e.target.closest('.pc');
  if(card) card.classList.toggle('open');
});

$('#q').addEventListener('input', render);
$('#clr').addEventListener('click', () => { $('#q').value=''; render(); $('#q').focus(); });
render();
</script>
